<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <div style="width:100%; padding: 20px;">
    <h1>مرحباً بك في لوحة الإدارة الآمنة</h1>
    <div id="adminContent">جاري تحميل البيانات الآمنة...</div>
    <button id="logoutBtn" style="width: auto; margin-top: 20px;">تسجيل الخروج</button>
  </div>

  <script type="module">
    import { requireAdmin } from "../js/auth-guard.js";
    import { auth } from "../js/firebase-init.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // تفعيل الحارس
    requireAdmin();

    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = "/index.html");
    });
  </script>
</body>
</html>
